name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"

      - name: Verify plugin version matches tag
        run: |
          PLUGIN_VERSION=$(grep -E "^\s*\*\s*Version:" mega-kadence-bridge.php | head -1 | sed -E 's/.*Version:\s*//' | tr -d ' ')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PLUGIN_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Plugin header version ($PLUGIN_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Plugin version matches tag: $PLUGIN_VERSION"

      - name: Download plugin-update-checker library
        run: |
          mkdir -p includes/lib
          cd includes/lib
          curl -sL https://github.com/YahnisElsts/plugin-update-checker/archive/refs/tags/v5.6.zip -o puc.zip
          unzip -q puc.zip
          mv plugin-update-checker-5.6 plugin-update-checker
          rm puc.zip
          echo "Plugin-update-checker library installed"

      - name: Download Parsedown dependency
        run: |
          # PUC's GitHubApi.php calls Parsedown::instance()->text($release->body)
          # whenever a release body is non-empty. Parsedown is declared in PUC's
          # composer.json suggests/dev-deps but is NOT in the source tarball, so
          # any non-empty release notes fatal customer sites with "Class Parsedown
          # not found." We bundle it explicitly. MIT-licensed, single file, pinned
          # to v1.7.4 (the canonical stable release).
          curl -sL https://github.com/erusev/parsedown/raw/1.7.4/Parsedown.php \
            -o includes/lib/Parsedown.php
          curl -sL https://github.com/erusev/parsedown/raw/1.7.4/LICENSE.txt \
            -o includes/lib/Parsedown-LICENSE.txt
          # Sanity check: file exists and declares the class.
          grep -q "class Parsedown" includes/lib/Parsedown.php
          echo "Parsedown bundled at includes/lib/Parsedown.php"

      - name: Build release ZIP
        run: |
          # Create a clean staging directory
          mkdir -p /tmp/mega-kadence-bridge

          # Copy plugin files, respecting .distignore
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.distignore' \
            --exclude='.editorconfig' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='*.zip' \
            ./ /tmp/mega-kadence-bridge/

          # Create the ZIP with the plugin in a top-level folder matching the slug
          cd /tmp
          zip -r mega-kadence-bridge.zip mega-kadence-bridge/
          mv mega-kadence-bridge.zip $GITHUB_WORKSPACE/
          ls -la $GITHUB_WORKSPACE/mega-kadence-bridge.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mega-kadence-bridge.zip
          # Body MUST stay empty: PUC's GitHubApi runs Parsedown on any non-empty
          # release body, which fatals installs still on <=1.2.1 (no bundled
          # Parsedown). This crashed mega.management on 2026-06-08. Keep empty.
          generate_release_notes: false
          body: ""
          draft: false
          prerelease: false
